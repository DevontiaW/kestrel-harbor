<svg class="km" id="town-inside" viewBox="0 0 340 358" role="img" aria-labelledby="town-inside-t" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:520px;display:block"><title id="town-inside-t">How the town works inside: Simulation engine, then Event log, then Metrics and trace, then Screen</title><style>.km-bg{fill:#fff}.km-box{fill:#f6f8f4;stroke:#8d9a8e;stroke-width:1.2}.km-t{fill:#202723;font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}.km-s{fill:#5d6b62;font:11.5px system-ui,-apple-system,'Segoe UI',sans-serif}.km-seg{fill:none;stroke:#3e7aa6;stroke-width:1.2;stroke-dasharray:5 4}.km-segt{fill:#3e7aa6;font:600 11px system-ui,-apple-system,'Segoe UI',sans-serif}.km-work{stroke:#202723;stroke-width:1.6;fill:none}.km-rec{stroke:#5d6b62;stroke-width:1.4;stroke-dasharray:2 3;fill:none}.km-sen{fill:#3e7aa6}.km-chk{fill:#c2502e}.km-off{fill:#9aa39c}.km-mk{fill:#fff;font:700 11px system-ui,sans-serif;text-anchor:middle}.km-hot .km-box{stroke:#c2502e;stroke-width:2.4}.km-path{stroke:#c2502e;stroke-width:3.2}.km-ah{fill:#202723}.km-ahp{fill:#c2502e}@media (prefers-color-scheme:dark){.km-bg{fill:#1b211e}.km-box{fill:#242c28;stroke:#7d8a80}.km-t{fill:#eef2ec}.km-s{fill:#b3beb5}.km-work{stroke:#e4e9e2}.km-ah{fill:#e4e9e2}.km-rec{stroke:#b3beb5}.km-seg{stroke:#7fb2d8}.km-segt{fill:#7fb2d8}.km-sen{fill:#5d9ccc}.km-chk{fill:#e0714c}.km-hot .km-box{stroke:#e0714c}.km-path{stroke:#e0714c}.km-ahp{fill:#e0714c}}</style><defs><marker id="town-inside-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="km-ah" d="M0 0L8 4L0 8Z"/></marker></defs><rect class="km-bg" width="340" height="358" rx="8"/><rect class="km-box" x="10" y="10" width="320" height="62" rx="6"/><text class="km-t" x="22" y="35">1. Simulation engine</text><text class="km-s" x="22" y="55">a clock ticks once a minute; tasks move between stations</text><path class="km-work" d="M170 72V100" marker-end="url(#town-inside-arrow)"/><rect class="km-box" x="10" y="102" width="320" height="62" rx="6"/><text class="km-t" x="22" y="127">2. Event log</text><text class="km-s" x="22" y="147">every minute of every task: working or waiting, and why</text><path class="km-work" d="M170 164V192" marker-end="url(#town-inside-arrow)"/><rect class="km-box" x="10" y="194" width="320" height="62" rx="6"/><text class="km-t" x="22" y="219">3. Metrics and trace</text><text class="km-s" x="22" y="239">counted from the log, never typed in</text><path class="km-work" d="M170 256V284" marker-end="url(#town-inside-arrow)"/><rect class="km-box" x="10" y="286" width="320" height="62" rx="6"/><text class="km-t" x="22" y="311">4. Screen</text><text class="km-s" x="22" y="331">the town, the panels and the lessons</text></svg>
