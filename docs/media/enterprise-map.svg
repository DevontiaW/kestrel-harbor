<svg class="km" id="enterprise-map" viewBox="0 0 340 580" role="img" aria-labelledby="enterprise-map-t enterprise-map-d" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:520px;display:block"><title id="enterprise-map-t">Enterprise map: where the town's pieces sit in a company network, with sensors (S) and checkpoints (C)</title><desc id="enterprise-map-d">Model service (town: the remote model API); Outside address (town: anywhere beyond the harbor); Network edge (egress gate) (town: the internet uplink at the exchange); Model gateway (town: the model API link); Identity provider (town: the ops office: who may do what); Agents (town: research, planning, execution); Tools (town: local tools and files); People: review, approval (town: the review desk and shift lead); Log collector (town: the event log); SIEM (town: none; links records, raises alerts). Sensors on: Agent traces, Tool-call log, Prompt and response log, Connection log, Approval log, Sign-in log. Checkpoints: Tool checkpoint, Gateway policy, Egress gate. Highlighted: A poisoned task tells the execution agent to send a customer file to an outside address.</desc><style>.km-bg{fill:#fff}.km-box{fill:#f6f8f4;stroke:#8d9a8e;stroke-width:1.2}.km-t{fill:#202723;font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}.km-s{fill:#5d6b62;font:11.5px system-ui,-apple-system,'Segoe UI',sans-serif}.km-seg{fill:none;stroke:#3e7aa6;stroke-width:1.2;stroke-dasharray:5 4}.km-segt{fill:#3e7aa6;font:600 11px system-ui,-apple-system,'Segoe UI',sans-serif}.km-work{stroke:#202723;stroke-width:1.6;fill:none}.km-rec{stroke:#5d6b62;stroke-width:1.4;stroke-dasharray:2 3;fill:none}.km-sen{fill:#3e7aa6}.km-chk{fill:#c2502e}.km-off{fill:#9aa39c}.km-mk{fill:#fff;font:700 11px system-ui,sans-serif;text-anchor:middle}.km-hot .km-box{stroke:#c2502e;stroke-width:2.4}.km-path{stroke:#c2502e;stroke-width:3.2}.km-ah{fill:#202723}.km-ahp{fill:#c2502e}@media (prefers-color-scheme:dark){.km-bg{fill:#1b211e}.km-box{fill:#242c28;stroke:#7d8a80}.km-t{fill:#eef2ec}.km-s{fill:#b3beb5}.km-work{stroke:#e4e9e2}.km-ah{fill:#e4e9e2}.km-rec{stroke:#b3beb5}.km-seg{stroke:#7fb2d8}.km-segt{fill:#7fb2d8}.km-sen{fill:#5d9ccc}.km-chk{fill:#e0714c}.km-hot .km-box{stroke:#e0714c}.km-path{stroke:#e0714c}.km-ahp{fill:#e0714c}}</style><defs><marker id="enterprise-map-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="km-ah" d="M0 0L8 4L0 8Z"/></marker><marker id="enterprise-map-hot" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="km-ahp" d="M0 0L8 4L0 8Z"/></marker></defs><rect class="km-bg" width="340" height="580" rx="8"/><text class="km-segt" x="10" y="15">OUTSIDE YOUR NETWORK</text><rect class="km-seg" x="4" y="266" width="332" height="102" rx="8"/><text class="km-segt" x="328" y="362" text-anchor="end">AGENT NETWORK SEGMENT</text><path class="km-work" d="M84 290V252" marker-end="url(#enterprise-map-arrow)"/><path class="km-work" d="M84 192V168" marker-end="url(#enterprise-map-arrow)"/><path class="km-work" d="M84 108V84" marker-end="url(#enterprise-map-arrow)"/><path class="km-work km-path" d="M154 319H188" marker-end="url(#enterprise-map-hot)"/><path class="km-work km-path" d="M208 290V276H170V168" marker-end="url(#enterprise-map-hot)"/><path class="km-work km-path" d="M252 108V84" marker-end="url(#enterprise-map-hot)"/><path class="km-work" d="M84 348V382" marker-end="url(#enterprise-map-arrow)"/><path class="km-rec" d="M84 442V468"/><path class="km-rec" d="M165 497H175"/><g class=""><rect class="km-box" x="10" y="24" width="155" height="58" rx="6"/><text class="km-t" x="18" y="45">Model service</text><text class="km-s" x="18" y="62">Town: the remote model</text><text class="km-s" x="18" y="76">API</text></g><g class="km-hot"><rect class="km-box" x="175" y="24" width="155" height="58" rx="6"/><text class="km-t" x="183" y="45">Outside address</text><text class="km-s" x="183" y="62">Town: anywhere beyond</text><text class="km-s" x="183" y="76">the harbor</text></g><g class="km-hot"><rect class="km-box" x="10" y="108" width="320" height="58" rx="6"/><text class="km-t" x="18" y="129">Network edge (egress gate)</text><text class="km-s" x="18" y="146">Town: the internet uplink at the exchange</text><g><circle class="km-sen" cx="318" cy="108" r="9"/><text class="km-mk" x="318" y="112">S</text></g><g><path class="km-chk" d="M294 98L304 108L294 118L284 108Z"/><text class="km-mk" x="294" y="112">C</text></g></g><g class=""><rect class="km-box" x="10" y="192" width="155" height="58" rx="6"/><text class="km-t" x="18" y="213">Model gateway</text><text class="km-s" x="18" y="230">Town: the model API</text><text class="km-s" x="18" y="244">link</text><g><circle class="km-sen" cx="153" cy="192" r="9"/><text class="km-mk" x="153" y="196">S</text></g><g><path class="km-chk" d="M129 182L139 192L129 202L119 192Z"/><text class="km-mk" x="129" y="196">C</text></g></g><g class=""><rect class="km-box" x="175" y="192" width="155" height="58" rx="6"/><text class="km-t" x="183" y="213">Identity provider</text><text class="km-s" x="183" y="230">Town: the ops office:</text><text class="km-s" x="183" y="244">who may do what</text><g><circle class="km-sen" cx="318" cy="192" r="9"/><text class="km-mk" x="318" y="196">S</text></g></g><g class="km-hot"><rect class="km-box" x="14" y="290" width="140" height="58" rx="6"/><text class="km-t" x="22" y="311">Agents</text><text class="km-s" x="22" y="328">Town: research,</text><text class="km-s" x="22" y="342">planning, execution</text><g><circle class="km-sen" cx="142" cy="290" r="9"/><text class="km-mk" x="142" y="294">S</text></g></g><g class="km-hot"><rect class="km-box" x="190" y="290" width="136" height="58" rx="6"/><text class="km-t" x="198" y="311">Tools</text><text class="km-s" x="198" y="328">Town: local tools</text><text class="km-s" x="198" y="342">and files</text><g><circle class="km-sen" cx="314" cy="290" r="9"/><text class="km-mk" x="314" y="294">S</text></g><g><path class="km-chk" d="M290 280L300 290L290 300L280 290Z"/><text class="km-mk" x="290" y="294">C</text></g></g><g class=""><rect class="km-box" x="10" y="384" width="320" height="58" rx="6"/><text class="km-t" x="18" y="405">People: review, approval</text><text class="km-s" x="18" y="422">Town: the review desk and shift lead</text><g><circle class="km-sen" cx="318" cy="384" r="9"/><text class="km-mk" x="318" y="388">S</text></g></g><g class=""><rect class="km-box" x="10" y="468" width="155" height="58" rx="6"/><text class="km-t" x="18" y="489">Log collector</text><text class="km-s" x="18" y="506">Town: the event log</text></g><g class=""><rect class="km-box" x="175" y="468" width="155" height="58" rx="6"/><text class="km-t" x="183" y="489">SIEM</text><text class="km-s" x="183" y="506">Town: none; links</text><text class="km-s" x="183" y="520">records, raises alerts</text></g><g><circle class="km-sen" cx="18" cy="556" r="9"/><text class="km-mk" x="18" y="560">S</text></g><text class="km-s" x="32" y="560">Sensor: watch here</text><g><path class="km-chk" d="M170 546L180 556L170 566L160 556Z"/><text class="km-mk" x="170" y="560">C</text></g><text class="km-s" x="184" y="560">Checkpoint: decide and stop</text></svg>
